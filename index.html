
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MovieApp - Movies</title>
</head>
<body>

    <div class="container">

        <header class="site-header">
            <div class="logo">MovieApp</div>

            <nav class="main-nav">
                <a href="#">Home</a>
                <a href="#">Trending</a>
            </nav>

            <form class="search-box">
                <input type="text" class="search-input" placeholder="Search movies..." autocomplete="off">
                <button type="submit" class="search-btn" aria-label="Search">🔍</button>
            </form>

            <button class="theme-toggle" aria-label="Toggle light/dark mode">☀️</button>
        </header>

        <main class="site-main">

            <section class="hero-movie">
                <img src="" alt="Featured movie" id="img-hero">

                <article class="hero-info">
                    <h3 class="hero-title"></h3>
                    <h4 class="hero-rating-year"></h4>
                    <p class="movie-about"></p>
                    <button type="button" class="look-details">View Details</button>
                </article>
            </section>

            <section class="trending">
                <h3>Trending Movies</h3>
                <button class="prev-btn" aria-label="Previous movies">←</button>

                <div class="trending-movies">
                </div>

                <button class="next-btn" aria-label="Next movies">→</button>
            </section>

            <div class="content-wrapper">

                <aside class="genre-sidebar">
                    <h3>Filters</h3>

                    <div class="filter-group">
                        <h4>Genres</h4>
                        <ul class="genre-list">
                            <li><button class="genre-btn active" data-genre="all">All</button></li>
                            <li><button class="genre-btn" data-genre="action">Action</button></li>
                            <li><button class="genre-btn" data-genre="drama">Drama</button></li>
                            <li><button class="genre-btn" data-genre="comedy">Comedy</button></li>
                            <li><button class="genre-btn" data-genre="animation">Animation</button></li>
                        </ul>
                    </div>

                    <div class="filter-group">
                        <label for="year-select">Release Year:</label>
                        <select id="year-select" class="year-select">
                            <option value="all">All Years</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                            <option value="2021">2021</option>
                            <option value="2020">2020</option>
                            <option value="2010s">2010s</option>
                            <option value="older">Older</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="sort-select">Sort By:</label>
                        <select id="sort-select" class="sort-select">
                            <option value="">Default</option>
                            <option value="popularity.desc">Most Popular</option>
                            <option value="vote_average.desc">Highest Rated</option>
                            <option value="primary_release_date.desc">Newest Releases</option>
                        </select>
                    </div>

                </aside>

                <section class="movie-catalog">
                    <h2>All Movies</h2>

                    <div class="status-message hidden">
                    </div>

                    <div class="movie-grid">
                    </div>

                    <nav class="pagination" aria-label="Pagination">
                        <button class="btn-prev" id="prev-pageId" disabled>Previous</button>

                        <span class="page-numbers"></span>

                        <button class="btn-next" id="next-pageId">Next</button>
                    </nav>
                </section>

            </div>

        </main>

        <footer class="site-footer">
            <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">
                <img src="tmdb.svg" alt="TMDB Logo">
            </a>
            <p>
                This product uses the TMDB API but is not endorsed or certified by TMDB.
            </p>
        </footer>


        
    </div>

    <div class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close">&times;</button>

            <div class="modal-body">
            </div>
        </div>
    </div>

    <script src="movieApp.js"></script>
</body>
</html>
